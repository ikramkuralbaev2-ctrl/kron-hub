<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRON Ekotizim Portali</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 40px 20px; }
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 30px; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #334155; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card h3 { color: #f1f5f9; margin-bottom: 8px; }
        .btn { display: inline-block; padding: 10px 20px; background: #0284c7; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 5px; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>KRON HUB</h1>
        <p>Barcha rasmiy manbalar va hamjamiyat havolalari</p>
        
        <div class="card">
            <h3>Telegram Kanal</h3>
            <p>E'lonlar va yangiliklar manzili</p>
            <a href="https://t.me/kanal_linki" class="btn" target="_blank">Azo bo'lish</a>
        </div>

        <div class="card">
            <h3>KRON Guide Bot</h3>
            <p>24/7 Avtomatik yordamchi bot</p>
            <a href="https://t.me/bot_username" class="btn" target="_blank">Botni Boshlash</a>
        </div>

        <div class="card">
            <h3>Discord Server</h3>
            <p>O'zaro muloqot hamjamiyati</p>
            <a href="https://discord.gg/link" class="btn" target="_blank">Kirish</a>
        </div>
    </div>

    <!-- Telegram Bot backend logikasi Node.js uchun ushbu skript orqali ishlaydi -->
    <script serverless>
        const { Telegraf } = require('telegraf');
        const bot = new Telegraf(process.env.BOT_TOKEN);

        bot.start((ctx) => ctx.reply('Xush kelibsiz! KRON Ekotizim portaliga xush kelibsiz.'));
        bot.help((ctx) => ctx.reply('Sizga qanday yordam berishim mumkin?'));
        bot.on('text', (ctx) => ctx.reply(`Siz yubordingiz: ${ctx.message.text}`));

        module.exports = async (req, res) => {
            if (req.method === 'POST') {
                await bot.handleUpdate(req.body);
                res.status(200).send('OK');
            } else {
                res.status(200).send('KRON Bot 24/7 rejimda ishlamoqda!');
            }
        };
    </script>
</body>
</html>
